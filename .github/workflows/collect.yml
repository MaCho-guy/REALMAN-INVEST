# 이 파일은 저장소 **맨 위**의 .github/workflows/collect.yml 로 두어야 돕니다.
# (stock_dashboard/ 안에 두면 GitHub 가 읽지 않습니다.)
#
# 하는 일: 정해진 시각에 tools/collect.py 를 돌려 모든 화면의 데이터를 받고,
# 결과 한 파일(seed.pkl.gz)을 data 브랜치에 덮어씁니다. 대시보드는 깨어날 때
# 그 파일을 읽어 바로 그립니다.
#
# 준비: 저장소 Settings → Secrets and variables → Actions 에
#   DART_API_KEY, FRED_API_KEY  (없으면 그 항목만 건너뜁니다)
name: collect

on:
  schedule:
    # 시각은 UTC 입니다. GitHub 는 붐빌 때 몇 분~수십 분 늦게 돌립니다.
    - cron: "30 21 * * *"     # 매일 06:30 KST — 아침에 열기 전
    - cron: "50 6 * * 1-5"    # 평일 15:50 KST — 국내 장 마감 뒤
  workflow_dispatch: {}       # Actions 화면에서 손으로도 돌릴 수 있게

permissions:
  contents: write             # data 브랜치에 올리는 데만 씁니다

concurrency:
  group: collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_dashboard/requirements.txt

      - name: 필요한 패키지
        run: pip install -r stock_dashboard/requirements.txt

      - name: 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TZ: Asia/Seoul
        run: python stock_dashboard/tools/collect.py --out "$RUNNER_TEMP/seed"

      - name: data 브랜치에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/seed"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
