# 재무 계정 조사 — 손으로만 돌립니다 (Actions 화면 → Run workflow).
# '판정 불가' 가 왜 나는지 전 종목의 실제 응답으로 세어 로그에 찍습니다.
# 데이터 파일이나 화면은 건드리지 않습니다.
name: survey

on:
  workflow_dispatch:
    inputs:
      market:
        description: "us (SEC) 또는 kr (DART)"
        default: "us"

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock_dashboard/requirements.txt
      - name: 필요한 패키지
        run: pip install -r stock_dashboard/requirements.txt
      - name: 조사
        env:
          TZ: Asia/Seoul
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          MARKET: ${{ inputs.market }}
        run: |
          if [ "$MARKET" = "kr" ]; then
            python stock_dashboard/tools/kr_account_survey.py
          else
            python stock_dashboard/tools/tag_survey.py
          fi
